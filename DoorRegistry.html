function qcStyle(s){if(s==="Approved")return{bg:C.successBg,color:C.success};if(s==="Failed")return{bg:C.dangerBg,color:C.danger};return{bg:C.warningBg,color:C.warning};}
function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function lsGet(key,fb){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fb;}catch{return fb;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){console.warn(e);}}
async function callClaude(messages,system,apiKey){
  const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,system,messages})});
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||"API error");}
  const data=await resp.json();return data.content?.find(b=>b.type==="text")?.text||"";
}
// Robustly extract the first valid JSON object from a string that may contain surrounding text
function extractJSON(raw){
  if(!raw)throw new Error("Empty response from API");
  // Try direct parse first
  const trimmed=raw.trim();
  try{return JSON.parse(trimmed);}catch(_){}
  // Strip markdown code fences
  const stripped=trimmed.replace(/^```(?:json)?\s*/i,"").replace(/\s*```\s*$/,"").trim();
  try{return JSON.parse(stripped);}catch(_){}
  // Find first { ... } block
  const start=raw.indexOf("{");
  const end=raw.lastIndexOf("}");
  if(start!==-1&&end>start){
    try{return JSON.parse(raw.slice(start,end+1));}catch(_){}
  }
  throw new Error("Could not extract valid JSON from response. Raw: "+raw.slice(0,200));
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){

  const [doors,setDoors]=useState(()=>lsGet("dr_doors",null));

  const [activeDoorId,setActiveDoorId]=useState(null);

  const [gs,setGs]=useState("");const [gFn,setGFn]=useState("");const [gTh,setGTh]=useState("");const [gQc,setGQc]=useState("");
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("dr_apikey")||"");

  useEffect(()=>{
    if(projects===null){setProjects(DEMO_PROJECTS);lsSet("dr_projects",DEMO_PROJECTS);}
    if(doors===null){setDoors(DEMO_DOORS);lsSet("dr_doors",DEMO_DOORS);}
  },[]);
  useEffect(()=>{if(projects!==null)lsSet("dr_projects",projects);},[projects]);
  useEffect(()=>{if(doors!==null)lsSet("dr_doors",doors);},[doors]);
  useEffect(()=>{localStorage.setItem("dr_apikey",apiKey);},[apiKey]);

  const upsertProject=useCallback(p=>setProjects(ps=>(ps||[]).find(x=>x.id===p.id)?ps.map(x=>x.id===p.id?p:x):[...(ps||[]),p]),[]);
  const upsertDoor=useCallback(d=>setDoors(ds=>(ds||[]).find(x=>x.id===d.id&&x.projectId===d.projectId)?ds.map(x=>x.id===d.id&&x.projectId===d.projectId?d:x):[...(ds||[]),d]),[]);
  const removeDoor=useCallback((pid,did)=>{setDoors(ds=>(ds||[]).filter(x=>!(x.id===did&&x.projectId===pid)));setActiveDoorId(null);},[]);
  const removeProject=useCallback(id=>{setProjects(ps=>(ps||[]).filter(p=>p.id!==id));setDoors(ds=>(ds||[]).filter(d=>d.projectId!==id));setView("home");setActiveProject(null);setActiveDoorId(null);},[]);

  const goProject=useCallback(p=>{setActiveProject(p);setActiveDoorId(null);setView("project");},[]);

      <div style={{background:C.card,borderBottom:"1px solid rgba(0,0,0,0.1)",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:52,position:"sticky",top:0,zIndex:50,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>

          {view==="global"&&<><span style={{color:C.hint}}>›</span><span style={{fontSize:13,color:C.muted}}>Global Search</span></>}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button style={BSm} onClick={()=>setView("global")}>Global Search</button>
          <button style={BSm} onClick={()=>setShowSettings(true)}>Settings</button>
          {view==="project"&&<button style={BP} onClick={()=>setShowAddDoor(true)}>+ Add Door</button>}
          {view==="home"&&<button style={BP} onClick={()=>setShowWizard(true)}>+ New Project</button>}
        </div>
      </div>

      {/* HOME */}
      {view==="home"&&(

              </div>);

            {sp.length===0&&<div style={{...CS,color:C.muted,fontSize:13,textAlign:"center",padding:32,gridColumn:"1/-1"}}>No projects yet. Click "+ New Project" to begin.</div>}
          </div>

      {/* PROJECT — always shows split layout with door list on left */}
      {view==="project"&&activeProject&&(
        <ProjectView
          project={activeProject} doors={pd} activeDoor={activeDoor} activeDoorId={activeDoorId}
          onSelectDoor={setActiveDoorId}
          onDeleteProject={()=>removeProject(activeProject.id)}
          showAdd={showAddDoor} setShowAdd={setShowAddDoor}
          onSaveDoor={d=>{upsertDoor(d);setActiveDoorId(d.id);}}
          onDeleteDoor={(pid,did)=>removeDoor(pid,did)}
          apiKey={apiKey}
        />
      )}

      {/* GLOBAL */}
      {view==="global"&&(
        <div style={{maxWidth:920,margin:"0 auto",padding:"28px 20px"}}>
          <h2 style={{fontSize:20,fontWeight:500,marginBottom:16}}>Global Search</h2>
          <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
            <input style={{...IS,maxWidth:260}} placeholder="Search all doors..." value={gs} onChange={e=>setGs(e.target.value)} />
            <select style={{...IS,width:"auto"}} value={gFn} onChange={e=>setGFn(e.target.value)}><option value="">All Functions</option>{DOOR_FUNCTIONS.map(f=><option key={f}>{f}</option>)}</select>
            <select style={{...IS,width:"auto"}} value={gTh} onChange={e=>setGTh(e.target.value)}><option value="">All Thermal</option><option>Thermal</option><option>Non-Thermal</option></select>
            <select style={{...IS,width:"auto"}} value={gQc} onChange={e=>setGQc(e.target.value)}><option value="">All QC</option><option>Approved</option><option>Pending</option><option>Failed</option></select>
          </div>
          <div style={{fontSize:12,color:C.muted,marginBottom:10}}>{gf.length} result{gf.length!==1?"s":""}</div>

            {gf.map(d=>{
              const proj=sp.find(p=>p.id===d.projectId);const qc=qcStyle(d.qcStatus);
              return(<div key={`${d.projectId}-${d.id}`} style={{...CS,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,padding:"10px 16px",transition:"box-shadow 0.15s"}}
                onClick={()=>{const p=sp.find(x=>x.id===d.projectId);goDoor(d.id,p);}}
                onMouseEnter={e=>e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,0.08)"}

                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>{[d.doorFunction,d.swing,d.manufacturer,d.model].filter(Boolean).join(" · ")}</div>

      {showWizard&&<ProjectWizard apiKey={apiKey} onClose={()=>setShowWizard(false)} onSave={(p,nd)=>{upsertProject(p);nd.forEach(upsertDoor);setShowWizard(false);goProject(p);}} />}
      {showSettings&&<SettingsModal apiKey={apiKey} setApiKey={setApiKey} onClose={()=>setShowSettings(false)} projects={sp} doors={sd} setProjects={setProjects} setDoors={setDoors} />}
    </div>
  );
}

// ── PROJECT VIEW — persistent split layout ────────────────────────────────────
function ProjectView({project,doors,activeDoor,activeDoorId,onSelectDoor,onDeleteProject,showAdd,setShowAdd,onSaveDoor,onDeleteDoor,apiKey}){
  const [search,setSearch]=useState("");
  const [viewingFile,setViewingFile]=useState(null);
  const [parseStatus,setParseStatus]=useState(""); // "", "parsing", "done", "error"
  const [parseMsg,setParseMsg]=useState("");
  const [scheduleFile,setScheduleFile]=useState(null);
  const schedRef=useRef();
  const filtered=doors.filter(d=>!search||`${d.id} ${d.location} ${d.hwSet} ${d.doorFunction}`.toLowerCase().includes(search.toLowerCase()));
  const handleSaveDoor=useCallback(d=>{onSaveDoor(d);},[onSaveDoor]);

  const parseHardwareSchedule=async()=>{
    if(!scheduleFile){alert("Upload the hardware schedule PDF first.");return;}
    if(!apiKey){alert("Add your Anthropic API key in Settings first.");return;}
    if(!project.scheduleApproved){alert("Mark the hardware schedule as approved before parsing cutsheets.");return;}
    setParseStatus("parsing");setParseMsg("Reading schedule index and hardware sets...");
    try{
      const b64=await fileToBase64(scheduleFile);
      const isImg=scheduleFile.type.startsWith("image/");
      const mediaType=isImg?scheduleFile.type:"application/pdf";
      const docType=isImg?"image":"document";

      // PASS 1: Extract door→set mapping and line items per set
      setParseMsg("Pass 1 of 2 — Reading door schedule and hardware sets...");
      const pass1Prompt=`This is a door hardware schedule submittal package. 
Read ALL pages carefully.

TASK: Extract two things:
1. The door index: which hardware set applies to each door ID
2. The full line items for each hardware set (qty, description, part number, finish, item code, manufacturer code)

Return ONLY valid JSON, no markdown:
{
  "doorSets": {"109A":"SF-1","110A":"SF-1","110B":"SF-2"},
  "sets": {
    "SF-1": [
      {"qty":"16","description":"Hinge, Full Mortise RC","partNumber":"TA2314 NRP 4-1/2x4","finish":"US32D","itemCode":"HI-1","mfr":"MK"},
      {"qty":"4","description":"Electric Power Transfer","partNumber":"EPT2 .689","finish":"689","itemCode":"PT-1","mfr":"VO"}
    ]
  }
}
Extract every door and every set completely. Part numbers must be exact as written.`;

      const pass1Raw=await callClaude([{role:"user",content:[{type:docType,source:{type:"base64",media_type:mediaType,data:b64.split(",")[1]}},{type:"text",text:pass1Prompt}]}],
        "You are a construction document parser. You MUST return ONLY a raw JSON object with no explanation, no markdown, no code fences, no preamble, no commentary. Start your response with { and end with }. Nothing else.",apiKey);
      const pass1=extractJSON(pass1Raw);

      setParseMsg("Pass 2 of 2 — Matching cutsheets to hardware items by part number...");

      // PASS 2: For each unique set that has doors, match cutsheet pages to part numbers
      const usedSets=new Set(Object.values(pass1.doorSets||{}));
      const setData=pass1.sets||{};

      // Collect all unique part numbers across all used sets
      const allPartNumbers=[];
      usedSets.forEach(setId=>{
        const items=setData[setId]||[];
        items.forEach(item=>{if(item.partNumber)allPartNumbers.push(item.partNumber);});
      });
      const uniqueParts=[...new Set(allPartNumbers)];

      const pass2Prompt=`This is the same hardware schedule submittal package.
The back half contains product cutsheets — one or more pages per product.

I need to match cutsheet pages to these part numbers:
${uniqueParts.map((p,i)=>`${i+1}. ${p}`).join("\n")}

For each part number, identify which page numbers in this document contain its cutsheet.
A cutsheet page may cover multiple products. Look for highlighted or clouded sections that indicate the specific product being submitted.

Return ONLY valid JSON:
{
  "matches": {
    "TA2314 NRP 4-1/2x4": {"pages":[6,7],"note":"McKinney TA2314 hinge, highlighted row: 4.5x4 stainless"},
    "EPT2 .689": {"pages":[8,9],"note":"Von Duprin EPT-2 electrical power transfer"}
  }
}
Page numbers are 1-indexed. Include all pages that are part of that product's cutsheet section.`;

      const pass2Raw=await callClaude([{role:"user",content:[{type:docType,source:{type:"base64",media_type:mediaType,data:b64.split(",")[1]}},{type:"text",text:pass2Prompt}]}],
        "You are a construction document parser. You MUST return ONLY a raw JSON object with no explanation, no markdown, no code fences, no preamble, no commentary. Start your response with { and end with }. Nothing else.",apiKey);
      const pass2=extractJSON(pass2Raw);
      const matches=pass2.matches||{};

      // Now update each door with its hardware items and note which cutsheet pages apply
      const doorSetMap=pass1.doorSets||{};
      let updatedCount=0;
      doors.forEach(door=>{
        const setId=doorSetMap[door.id];
        if(!setId)return;
        const items=setData[setId]||[];
        // For each item, find matching cutsheet pages
        const itemsWithCutsheets=items.map(item=>{
          const match=matches[item.partNumber]||matches[Object.keys(matches).find(k=>k.includes(item.partNumber.split(" ")[0])||item.partNumber.includes(k.split(" ")[0]))||""]||null;
          return{...item,cutsheetPages:match?match.pages:[],cutsheetNote:match?match.note:""};
        });
        onSaveDoor({...door,hwSet:setId,hwItems:itemsWithCutsheets,hwCutsheetSource:b64,hwCutsheetMediaType:mediaType,hwCutsheetDocType:docType});
        updatedCount++;
      });

      setParseStatus("done");
      setParseMsg(`Done — updated ${updatedCount} door${updatedCount!==1?"s":""} with hardware data.`);
    }catch(e){
      setParseStatus("error");
      setParseMsg("Parse failed: "+e.message);
      console.error(e);
    }
  };

  return(
    <div style={{display:"flex",height:"calc(100vh - 52px)",overflow:"hidden"}}>
      {/* LEFT SIDEBAR */}
      <div style={{width:260,borderRight:"1px solid rgba(0,0,0,0.1)",display:"flex",flexDirection:"column",background:C.card,flexShrink:0}}>
        {/* Project header */}
        <div style={{padding:"10px 12px",borderBottom:"1px solid rgba(0,0,0,0.1)",background:C.surface}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:500,marginBottom:1}}>{project.jobNumber?"#"+project.jobNumber:""}</div>
          <div style={{fontSize:13,fontWeight:500,marginBottom:6}}>{project.name}</div>
          <input style={{...IS,fontSize:12}} placeholder="Search doors..." value={search} onChange={e=>setSearch(e.target.value)} />
        </div>
        {/* Door list */}
        <div style={{flex:1,overflowY:"auto"}}>
          {filtered.length===0&&<div style={{padding:20,color:C.muted,fontSize:12,textAlign:"center"}}>No doors found</div>}
          {filtered.map(d=>(
            <DoorListItem key={d.id} door={d} active={d.id===activeDoorId} onClick={()=>{onSelectDoor(d.id);setViewingFile(null);}} />
          ))}
        </div>
        {/* Files for selected door */}
        {activeDoor&&(
          <FilesSidebar door={activeDoor} onSaveDoor={handleSaveDoor} onViewFile={setViewingFile} viewingFile={viewingFile} />
        )}
      </div>

      {/* MAIN PANEL */}
      <div style={{flex:1,overflowY:"auto",background:C.bg}}>
        {viewingFile?(
          <FileViewer file={viewingFile} onClose={()=>setViewingFile(null)} />
        ):activeDoor?(
          <DoorDetail
            key={activeDoor.id}
            door={activeDoor}
            onSave={handleSaveDoor}
            onDelete={()=>{onDeleteDoor(activeDoor.projectId,activeDoor.id);}}
          />
        ):(
          <div style={{padding:"32px 28px"}}>
            {/* Project overview */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24}}>
              <div>
                {project.jobNumber&&<div style={{fontSize:11,color:C.muted,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2}}>Job #{project.jobNumber}</div>}
                <h2 style={{fontSize:20,fontWeight:500,margin:0}}>{project.name}</h2>
                {project.address&&<div style={{fontSize:13,color:C.muted,marginTop:2}}>{project.address}</div>}
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"flex-end",alignItems:"center"}}>
                <span style={tag(C.successBg,C.success,{fontSize:12})}>{doors.filter(d=>d.qcStatus==="Approved").length} QC Approved</span>
                {doors.filter(d=>d.qcStatus==="Failed").length>0&&<span style={tag(C.dangerBg,C.danger,{fontSize:12})}>{doors.filter(d=>d.qcStatus==="Failed").length} Failed</span>}
                <span style={tag(C.warningBg,C.warning,{fontSize:12})}>{doors.filter(d=>d.qcStatus==="Pending").length} Pending</span>
                <button style={BDng} onClick={onDeleteProject}>Delete Project</button>
              </div>
            </div>

            {/* Hardware Schedule Parse Panel */}
            <div style={{...CS,marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.08em",color:C.muted,marginBottom:12,paddingBottom:6,borderBottom:"1px solid rgba(0,0,0,0.1)"}}>Hardware Schedule Parse</div>
              <p style={{fontSize:13,color:C.muted,marginBottom:14,lineHeight:1.6}}>Upload the full hardware schedule submittal PDF. The AI will read the door index and set pages, then match each door to its hardware items. If the schedule is marked approved, it will also scan the cutsheet pages and link product data to each door.</p>
              <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
                <div style={{border:"1px dashed rgba(0,0,0,0.18)",borderRadius:6,padding:"8px 14px",cursor:"pointer",fontSize:13,color:scheduleFile?C.text:C.muted,background:C.surface,flex:1,minWidth:180}} onClick={()=>schedRef.current.click()}>
                  {scheduleFile?scheduleFile.name:"Click to upload hardware schedule PDF"}
                </div>
                <input ref={schedRef} type="file" accept=".pdf,image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&setScheduleFile(e.target.files[0])} />
                <button style={{...BP,whiteSpace:"nowrap"}} onClick={parseHardwareSchedule} disabled={parseStatus==="parsing"||!scheduleFile}>
                  {parseStatus==="parsing"?"Parsing...":"Parse Schedule"}
                </button>
              </div>
              {!project.scheduleApproved&&<div style={{fontSize:12,color:C.warning,padding:"6px 10px",background:C.warningBg,borderRadius:5,marginBottom:8}}>Schedule not marked approved — cutsheet matching will be skipped. Mark approved in project settings to enable full parse.</div>}
              {!apiKey&&<div style={{fontSize:12,color:C.warning,padding:"6px 10px",background:C.warningBg,borderRadius:5,marginBottom:8}}>No API key set — go to Settings before parsing.</div>}
              {parseMsg&&(
                <div style={{fontSize:12,padding:"8px 12px",borderRadius:5,background:parseStatus==="error"?C.dangerBg:parseStatus==="done"?C.successBg:"#eff6ff",color:parseStatus==="error"?C.danger:parseStatus==="done"?C.success:C.info}}>
                  {parseStatus==="parsing"&&<span style={{marginRight:6}}>⏳</span>}{parseStatus==="done"&&<span style={{marginRight:6}}>✓</span>}{parseMsg}
                </div>
              )}
            </div>

            <div style={{color:C.muted,fontSize:13,textAlign:"center",padding:20}}>{doors.length===0?"No doors yet — click + Add Door to begin.":"← Select a door from the list to view its record."}</div>
          </div>
        )}
      </div>

      {showAdd&&<DoorModal projectId={project.id} onClose={()=>setShowAdd(false)} onSave={d=>{handleSaveDoor(d);setShowAdd(false);}} existingIds={doors.map(d=>d.id)} />}
    </div>
  );
}

// ── FILES SIDEBAR ─────────────────────────────────────────────────────────────
function FilesSidebar({door,onSaveDoor,onViewFile,viewingFile}){
  const fileRef=useRef();
  const [renamingIdx,setRenamingIdx]=useState(null);
  const [renameVal,setRenameVal]=useState("");
  const [drag,setDrag]=useState(false);

  const files=door.files||[];

  const addFileObjects=async(fileList)=>{
    const newFiles=[];
    for(const file of fileList){
      const b64=await fileToBase64(file);
      newFiles.push({id:`f-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,name:file.name,type:file.type,data:b64});
    }
    onSaveDoor({...door,files:[...files,...newFiles]});
  };

  const addFiles=async(e)=>{await addFileObjects(e.target.files);e.target.value="";};
  const dropFiles=async(e)=>{e.preventDefault();setDrag(false);if(e.dataTransfer.files.length)await addFileObjects(e.dataTransfer.files);};

  const removeFile=idx=>{
    const updated=files.filter((_,i)=>i!==idx);
    onSaveDoor({...door,files:updated});
  };

  const startRename=idx=>{setRenamingIdx(idx);setRenameVal(files[idx].name);};
  const commitRename=idx=>{
    if(!renameVal.trim()){setRenamingIdx(null);return;}
    const updated=files.map((f,i)=>i===idx?{...f,name:renameVal.trim()}:f);
    onSaveDoor({...door,files:updated});
    setRenamingIdx(null);
  };

  return(
    <div style={{borderTop:"1px solid rgba(0,0,0,0.1)",background:C.surface,maxHeight:280,display:"flex",flexDirection:"column"}}
      onDragOver={e=>{e.preventDefault();setDrag(true);}}
      onDragLeave={e=>{if(!e.currentTarget.contains(e.relatedTarget))setDrag(false);}}
      onDrop={dropFiles}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:`1px solid ${drag?"#b87514":"rgba(0,0,0,0.07)"}`,background:drag?C.accentLight:"transparent",transition:"all 0.15s"}}>
        <span style={{fontSize:11,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.06em",color:drag?C.accent:C.muted}}>{drag?"Drop files here":"Files"}</span>
        <button style={{...BSm,fontSize:10,padding:"2px 7px"}} onClick={()=>fileRef.current.click()}>+ Add</button>
        <input ref={fileRef} type="file" accept=".pdf,image/*" multiple style={{display:"none"}} onChange={addFiles} />
      </div>
      <div style={{overflowY:"auto",flex:1}}>
        {files.length===0&&<div style={{padding:"10px 12px",fontSize:11,color:C.hint}}>No files attached. Click + Add or drag & drop files here.</div>}
        {files.map((f,i)=>{
          const isViewing=viewingFile&&viewingFile.id===f.id;
          return(
            <div key={f.id||i} style={{padding:"6px 12px",borderBottom:"1px solid rgba(0,0,0,0.05)",background:isViewing?"#fff8ee":"transparent"}}>
              {renamingIdx===i?(
                <div style={{display:"flex",gap:4}}>
                  <input style={{...IS,fontSize:11,padding:"3px 6px",flex:1}} value={renameVal} onChange={e=>setRenameVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")commitRename(i);if(e.key==="Escape")setRenamingIdx(null);}} autoFocus />
                  <button style={{...BSm,fontSize:10,padding:"2px 6px"}} onClick={()=>commitRename(i)}>OK</button>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <span style={{fontSize:11,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:"pointer",color:isViewing?C.accent:C.text}} onClick={()=>onViewFile(f)} title={f.name}>{f.name}</span>
                  <button style={{...BSm,fontSize:9,padding:"1px 5px",flexShrink:0}} onClick={()=>startRename(i)}>✎</button>
                  <button style={{...BDng,fontSize:9,padding:"1px 5px",flexShrink:0}} onClick={()=>removeFile(i)}>✕</button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Card({title,children,full}){return(<div style={{...CS,gridColumn:full?"1 / -1":"auto"}}><div style={{fontSize:11,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.08em",color:C.muted,marginBottom:10,paddingBottom:6,borderBottom:"1px solid rgba(0,0,0,0.1)"}}>{title}</div>{children}</div>);}
function Row({label,value,accent,mono,color}){return(<div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",padding:"4px 0",borderBottom:"1px solid rgba(0,0,0,0.06)",gap:10}}><span style={{fontSize:11,color:C.muted,whiteSpace:"nowrap",flexShrink:0}}>{label}</span><span style={{fontSize:mono?12:13,fontWeight:500,textAlign:"right",color:color||(accent?C.accent:C.text),fontFamily:mono?"monospace":"inherit",wordBreak:"break-word"}}>{value||"—"}</span></div>);}
function ImgSlot({label,value,field,onUpload}){
  const ref=useRef();
  const [drag,setDrag]=useState(false);
  const drop=e=>{e.preventDefault();setDrag(false);const f=e.dataTransfer.files[0];if(f)onUpload(field,f);};
  return value?(
    <div>
      <img src={value} alt={label} style={{width:"100%",maxHeight:160,objectFit:"contain",borderRadius:6,border:"1px solid rgba(0,0,0,0.1)"}} />
      <button style={{...BSm,marginTop:5,fontSize:10}} onClick={()=>onUpload(field,null)}>Remove</button>
    </div>
  ):(
    <div style={{border:`1px dashed ${drag?"#b87514":"rgba(0,0,0,0.18)"}`,background:drag?C.accentLight:"transparent",borderRadius:6,padding:"20px 12px",textAlign:"center",cursor:"pointer",transition:"all 0.15s"}}
      onClick={()=>ref.current.click()}
      onDragOver={e=>{e.preventDefault();setDrag(true);}}
      onDragLeave={()=>setDrag(false)}
      onDrop={drop}>
      <div style={{fontSize:12,color:C.muted}}>{drag?"Drop to upload":label}</div>
      <div style={{fontSize:11,color:C.hint,marginTop:3}}>{drag?"":"Click or drag & drop image"}</div>
      <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&onUpload(field,e.target.files[0])} />
    </div>
  );
}

// ── HARDWARE CUTSHEETS VIEWER ─────────────────────────────────────────────────
function HardwareCutsheets({door}){
  const [selected,setSelected]=useState(null); // {itemCode, description, pages}
  const [lightbox,setLightbox]=useState(null);

  // Group items by their cutsheet pages — deduplicate so same pages don't appear twice
  const groups=[];
  const seenPageSets=new Set();
  (door.hwItems||[]).forEach(item=>{
    if(!item.cutsheetPages||item.cutsheetPages.length===0)return;
    const key=item.cutsheetPages.sort((a,b)=>a-b).join(",");
    if(seenPageSets.has(key)){
      // Add this item to existing group
      const g=groups.find(g=>g.pageKey===key);
      if(g)g.items.push(item);
    }else{
      seenPageSets.add(key);
      groups.push({pageKey:key,pages:item.cutsheetPages,items:[item],note:item.cutsheetNote});
    }
  });

  return(
    <div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>

function CutsheetPage({pageNum,door,onLightbox}){
  const [imgSrc,setImgSrc]=useState(null);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(false);

  useEffect(()=>{
    if(!door.hwCutsheetSource)return;
    // Render the PDF page using a canvas via PDF.js if available, otherwise show page reference
    const render=async()=>{
      try{
        if(door.hwCutsheetDocType==="image"){
          // It's an image, just show it
          setImgSrc(door.hwCutsheetSource);setLoading(false);return;
        }
        // Use PDF.js from CDN to render specific page
        if(!window.pdfjsLib){
          // Load PDF.js dynamically
          await new Promise((res,rej)=>{
            const s=document.createElement("script");
            s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
            s.onload=res;s.onerror=rej;document.head.appendChild(s);
          });
          window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        }
        const pdfData=atob(door.hwCutsheetSource.split(",")[1]);
        const arr=new Uint8Array(pdfData.length);
        for(let i=0;i<pdfData.length;i++)arr[i]=pdfData.charCodeAt(i);
        const pdf=await window.pdfjsLib.getDocument({data:arr}).promise;
        const page=await pdf.getPage(pageNum);
        const scale=1.5;
        const viewport=page.getViewport({scale});
        const canvas=document.createElement("canvas");
        canvas.height=viewport.height;canvas.width=viewport.width;
        await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
        setImgSrc(canvas.toDataURL());setLoading(false);
      }catch(e){setError(true);setLoading(false);}
    };
    render();
  },[pageNum,door.hwCutsheetSource]);

  return(
    <div style={{textAlign:"center"}}>
      <div style={{fontSize:10,color:C.muted,marginBottom:4}}>Page {pageNum}</div>
      {loading&&!error&&<div style={{width:200,height:280,background:"rgba(0,0,0,0.08)",borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:C.muted}}>Loading...</div>}
      {error&&<div style={{width:200,height:100,background:C.surface,borderRadius:4,border:"1px solid rgba(0,0,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:4,padding:12}}>
        <div style={{fontSize:11,color:C.muted}}>Page {pageNum}</div>
        <div style={{fontSize:10,color:C.hint}}>Preview unavailable</div>
      </div>}
      {imgSrc&&!loading&&<img src={imgSrc} onClick={()=>onLightbox(imgSrc)} style={{maxWidth:240,maxHeight:340,objectFit:"contain",borderRadius:4,border:"1px solid rgba(0,0,0,0.1)",cursor:"zoom-in",boxShadow:"0 2px 8px rgba(0,0,0,0.15)"}} />}
    </div>
  );
}

// Stable input — onChange receives the value string, parent stores it
// No re-render of the input itself unless value prop changes
function StableInput({label,value,onChange,type,full}){
  const ref=useRef();
  // Sync external value changes without stealing focus
  useEffect(()=>{if(ref.current&&document.activeElement!==ref.current)ref.current.value=value||"";},[value]);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:4,gridColumn:full?"1/-1":"auto"}}>
      <label style={LS}>{label}</label>
      <input ref={ref} style={IS} type={type||"text"} defaultValue={value||""} onChange={e=>onChange(e.target.value)} />
    </div>
  );
}
function StableSelect({label,value,onChange,opts,full}){
  return(
    <div style={{display:"flex",flexDirection:"column",gap:4,gridColumn:full?"1/-1":"auto"}}>
      <label style={LS}>{label}</label>
      <select style={IS} value={value||""} onChange={e=>onChange(e.target.value)}>
        <option value="">— select —</option>
        {opts.map(o=><option key={o}>{o}</option>)}
      </select>
    </div>
  );
}

        {type:isImg?"image":"document",source:{type:"base64",media_type:isImg?pdfFile.type:"application/pdf",data:b64.split(",")[1]}},
        {type:"text",text:`Extract all doors from this hardware schedule. Return ONLY valid JSON.\nFormat: {"doors":[{"id":"109A","hwSet":"SF-1","doorFunction":"Entrance / Vestibule","swing":"Pair - Active RH","transom":false,"sidelite":false,"fireRated":false,"location":"","elevation":"","hwSchedule":"","workOrder":"","qcSheet":"","qcStatus":"Pending","qcDate":""}]}\nExtract: door ID, hardware set, door function if stated, swing direction if stated (use formats like LH Inswing, RH Outswing, Pair - Active LH, etc.), fire-rated if noted. Leave manufacturer/model/glass blank.`}

    const all=[...completedDoors,curDoor];

      setCompletedDoors(all);
      setWizStep(wizStep+1);
      setCurDoor(applyDefaults({...parsedDoors[wizStep+1]}));

  const handleFileDrop=(e)=>{e.preventDefault();setDragOver(false);const f=e.dataTransfer.files[0];if(f)setPdfFile(f);};

  const STEPS=["Project Info","Upload Schedule","Review Doors","Per-Door Details"];

    {key:"glassSize",label:"Glass Size"},
    {key:"workOrderPrefix",label:"Work Order Prefix"},
  ];

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{...CS,width:600,maxWidth:"100%",maxHeight:"92vh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,0.18)"}}>
        <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:22,flexWrap:"wrap"}}>
          {STEPS.map((s,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:5}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:step>i+1?C.success:step===i+1?C.accent:C.border,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:500,flexShrink:0}}>{step>i+1?"✓":i+1}</div>
            <span style={{fontSize:11,color:step===i+1?C.text:C.muted}}>{s}</span>
            {i<STEPS.length-1&&<span style={{color:C.border,fontSize:14}}>›</span>}
          </div>))}
        </div>

        {/* STEP 1 — Project info + project defaults */}
        {step===1&&<>
          <h3 style={{fontSize:16,fontWeight:500,margin:"0 0 16px"}}>New Project</h3>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
            <div style={{display:"flex",flexDirection:"column",gap:4}}><label style={LS}>Job Number</label><input style={IS} value={proj.jobNumber} onChange={e=>setP("jobNumber",e.target.value)} placeholder="e.g. 2024-047" /></div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}><label style={LS}>Project Name *</label><input style={IS} value={proj.name} onChange={e=>setP("name",e.target.value)} placeholder="e.g. Riverside Medical Center" /></div>
            <div style={{display:"flex",flexDirection:"column",gap:4,gridColumn:"1/-1"}}><label style={LS}>Address (optional)</label><input style={IS} value={proj.address} onChange={e=>setP("address",e.target.value)} /></div>
            <div style={{display:"flex",alignItems:"center",gap:8,gridColumn:"1/-1"}}><input type="checkbox" id="sa" checked={proj.scheduleApproved} onChange={e=>setP("scheduleApproved",e.target.checked)} /><label htmlFor="sa" style={{fontSize:13}}>Hardware schedule is architect-approved</label></div>
          </div>
          {/* Project-wide defaults */}
          <div style={{borderTop:"1px solid rgba(0,0,0,0.1)",paddingTop:16,marginBottom:4}}>
            <div style={{fontSize:12,fontWeight:500,color:C.muted,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.06em"}}>Project Defaults (optional)</div>
            <p style={{fontSize:12,color:C.hint,marginBottom:12}}>Set values that apply to most doors. These auto-fill the wizard but can be overridden per door.</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {DEF_FIELDS.map(f=>(
                <div key={f.key} style={{display:"flex",flexDirection:"column",gap:3}}>
                  <label style={LS}>{f.label}</label>
                  {f.type==="select"?(
                    <select style={IS} value={defaults[f.key]} onChange={e=>setDef(f.key,e.target.value)}>
                      {f.opts.map(o=><option key={o}>{o}</option>)}
                    </select>
                  ):(
                    <input style={IS} value={defaults[f.key]} onChange={e=>setDef(f.key,e.target.value)} placeholder={f.key==="workOrderPrefix"?"e.g. WO-2025-":""} />
                  )}
                </div>
              ))}
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:20}}><button style={BS} onClick={onClose}>Cancel</button><button style={BP} onClick={()=>proj.name.trim()&&setStep(2)} disabled={!proj.name.trim()}>Next</button></div>
        </>}

        {/* STEP 2 — Upload */}
        {step===2&&<>
          <h3 style={{fontSize:16,fontWeight:500,margin:"0 0 6px"}}>Upload Hardware Schedule</h3>
          <p style={{fontSize:13,color:C.muted,margin:"0 0 16px"}}>AI reads the schedule and creates all doors including swing direction. Requires an Anthropic API key (set in Settings).</p>
          <div
            style={{border:`1px dashed ${dragOver?"#b87514":"rgba(0,0,0,0.18)"}`,background:dragOver?C.accentLight:"transparent",borderRadius:8,padding:28,textAlign:"center",cursor:"pointer",marginBottom:14,transition:"all 0.15s"}}
            onClick={()=>fileRef.current.click()}
            onDragOver={e=>{e.preventDefault();setDragOver(true);}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={handleFileDrop}>
            {pdfFile?<div><div style={{fontSize:14,fontWeight:500}}>{pdfFile.name}</div><div style={{fontSize:12,color:C.muted,marginTop:3}}>Click or drop to change</div></div>
            :<div><div style={{fontSize:13,color:C.muted}}>Click or drag & drop hardware schedule here</div><div style={{fontSize:12,color:C.hint,marginTop:3}}>PDF · JPG · PNG</div></div>}
            <input ref={fileRef} type="file" accept=".pdf,image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&setPdfFile(e.target.files[0])} />
          </div>
          {!apiKey&&<div style={{fontSize:12,color:C.warning,marginBottom:10,padding:"7px 10px",background:C.warningBg,borderRadius:5}}>No API key set — go to Settings before parsing.</div>}
          {parseError&&<div style={{fontSize:12,color:C.danger,marginBottom:12,padding:"8px 12px",background:C.dangerBg,borderRadius:5}}>{parseError}</div>}
          <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
            <button style={BS} onClick={()=>setStep(1)}>Back</button>
            <div style={{display:"flex",gap:8}}>
              <button style={BS} onClick={()=>{setParsedDoors([]);setStep(3);}}>Skip — add manually</button>
              <button style={BP} onClick={parseSchedule} disabled={!pdfFile||parsing}>{parsing?"Parsing...":"Parse Schedule"}</button>
            </div>
          </div>
        </>}

        {/* STEP 3 — Review */}
        {step===3&&<>
          <h3 style={{fontSize:16,fontWeight:500,margin:"0 0 6px"}}>{parsedDoors.length>0?`${parsedDoors.length} doors found`:"Ready to continue"}</h3>
          <p style={{fontSize:13,color:C.muted,margin:"0 0 16px"}}>{parsedDoors.length>0?"Review below, then walk through each door to confirm details and add images.":"No doors extracted. Add them manually after creating the project."}</p>
          {parsedDoors.length>0&&(
            <div style={{maxHeight:240,overflowY:"auto",border:"1px solid rgba(0,0,0,0.1)",borderRadius:6,marginBottom:16}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",padding:"5px 12px",borderBottom:"1px solid rgba(0,0,0,0.1)",background:C.surface}}>
                {["Door","Set","Swing"].map(h=><span key={h} style={{fontSize:10,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.05em",color:C.muted}}>{h}</span>)}
              </div>
              {parsedDoors.map((d,i)=>(
                <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",padding:"6px 12px",borderBottom:"1px solid rgba(0,0,0,0.07)",fontSize:12}}>
                  <span style={{fontWeight:500}}>{d.id}</span>
                  <span style={{color:C.muted}}>{d.hwSet}</span>
                  <span style={{color:d.swing?C.text:C.hint}}>{d.swing||"—"}</span>
                </div>
              ))}
            </div>
          )}
          <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
            <button style={BS} onClick={()=>setStep(2)}>Back</button>
            <div style={{display:"flex",gap:8}}>
              <button style={BS} onClick={finishNow}>Save & finish later</button>
              {parsedDoors.length>0?<button style={BP} onClick={startWizard}>Walk through doors</button>:<button style={BP} onClick={finishNow}>Create Project</button>}
            </div>
          </div>
        </>}

        {/* STEP 4 — Per-door */}
        {step===4&&curDoor&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <h3 style={{fontSize:16,fontWeight:500,margin:0}}>Door {wizStep+1} of {parsedDoors.length}</h3>
            <span style={{fontSize:24,fontWeight:500,color:C.accent}}>{curDoor.id}</span>
          </div>
          <div style={{background:C.surface,borderRadius:6,padding:"7px 12px",fontSize:13,color:C.muted,marginBottom:14}}>
            <b style={{color:C.text,fontWeight:500}}>{curDoor.hwSet}</b>{curDoor.doorFunction?` · ${curDoor.doorFunction}`:""}
            {curDoor.swing&&<span style={{marginLeft:8,...tag(C.infoBg,C.info,{fontSize:11,padding:"1px 6px"})}}>{curDoor.swing}</span>}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {/* Identification */}
            <div style={divSty}>Identification &amp; Location</div>
            <WizField label="Location / Grid Ref" value={curDoor.location||""} onChange={v=>setCurDoor(d=>({...d,location:v}))} />
            <WizField label="Elevation Ref" value={curDoor.elevation||""} onChange={v=>setCurDoor(d=>({...d,elevation:v}))} />

            {/* Door specs with defaults */}
            <div style={divSty}>Door Specs</div>
            <WizFieldDefault label="Manufacturer" fieldKey="manufacturer" curDoor={curDoor} setCurDoor={setCurDoor} defaults={defaults} setDef={setDef} useDefault={useDefault} toggleDef={toggleDef} />
            <WizFieldDefault label="Model / Series" fieldKey="model" curDoor={curDoor} setCurDoor={setCurDoor} defaults={defaults} setDef={setDef} useDefault={useDefault} toggleDef={toggleDef} />
            <WizFieldDefaultSelect label="Thermal" fieldKey="thermal" opts={["Thermal","Non-Thermal"]} curDoor={curDoor} setCurDoor={setCurDoor} defaults={defaults} setDef={setDef} useDefault={useDefault} toggleDef={toggleDef} />
            <WizField label="Finish" value={curDoor.finish||""} onChange={v=>setCurDoor(d=>({...d,finish:v}))} />
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              <label style={LS}>Door Swing <span style={{color:C.success,fontWeight:400,textTransform:"none",letterSpacing:0}}>{curDoor.swing?"(from schedule)":""}</span></label>
              <select style={IS} value={curDoor.swing||""} onChange={e=>setCurDoor(d=>({...d,swing:e.target.value}))}>
                <option value="">— select —</option>
                {SWING_OPTIONS.map(o=><option key={o}>{o}</option>)}
              </select>
            </div>
            <WizField label="Door Function" value={curDoor.doorFunction||""} onChange={v=>setCurDoor(d=>({...d,doorFunction:v}))} select opts={DOOR_FUNCTIONS} />
            <div style={{gridColumn:"1/-1",display:"flex",gap:16,flexWrap:"wrap"}}>
              {[["Transom","transom"],["Sidelite","sidelite"],["Fire Rated","fireRated"]].map(([lbl,k])=>(
                <label key={k} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:13}}>
                  <input type="checkbox" checked={!!curDoor[k]} onChange={e=>setCurDoor(d=>({...d,[k]:e.target.checked}))} />{lbl}
                </label>
              ))}
            </div>

            {/* Glass with defaults */}
            <div style={divSty}>Glass</div>
            <WizFieldDefault label="Glass Tag" fieldKey="glassTag" curDoor={curDoor} setCurDoor={setCurDoor} defaults={defaults} setDef={setDef} useDefault={useDefault} toggleDef={toggleDef} />
            <WizFieldDefault label="Glass Makeup" fieldKey="glassMakeup" curDoor={curDoor} setCurDoor={setCurDoor} defaults={defaults} setDef={setDef} useDefault={useDefault} toggleDef={toggleDef} full />
            <WizFieldDefault label="Glass Size" fieldKey="glassSize" curDoor={curDoor} setCurDoor={setCurDoor} defaults={defaults} setDef={setDef} useDefault={useDefault} toggleDef={toggleDef} />
            <div style={{display:"flex",alignItems:"center",gap:7,alignSelf:"flex-end",paddingBottom:4}}>
              <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:13}}>
                <input type="checkbox" checked={!!curDoor.hasMidrail} onChange={e=>setCurDoor(d=>({...d,hasMidrail:e.target.checked}))} />Has Mid Rail?
              </label>
            </div>
            {curDoor.hasMidrail&&<WizField label="Glass Size (Mid Rail)" value={curDoor.glassSizeMidrail||""} onChange={v=>setCurDoor(d=>({...d,glassSizeMidrail:v}))} />}

            {/* Fab & QC */}
            <div style={divSty}>Fabrication &amp; QC</div>
            <WizFieldDefault label="Work Order #" fieldKey="workOrderPrefix" curDoor={curDoor} setCurDoor={setCurDoor} defaults={defaults} setDef={setDef} useDefault={useDefault} toggleDef={toggleDef} woMode />
            <WizField label="QC Sheet Ref" value={curDoor.qcSheet||""} onChange={v=>setCurDoor(d=>({...d,qcSheet:v}))} />
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              <label style={LS}>QC Status</label>
              <select style={IS} value={curDoor.qcStatus||"Pending"} onChange={e=>setCurDoor(d=>({...d,qcStatus:e.target.value}))}>{QC_OPTIONS.map(o=><option key={o}>{o}</option>)}</select>
            </div>
            <WizField label="QC Date" value={curDoor.qcDate||""} onChange={v=>setCurDoor(d=>({...d,qcDate:v}))} type="date" />

            {/* Images */}
            <div style={divSty}>Images</div>
            <WizImg label="Elevation Image" field="elevationImage" value={curDoor.elevationImage} onUpload={uploadWizImg} />
            <WizImg label="Floor Plan Snippet" field="floorplanImage" value={curDoor.floorplanImage} onUpload={uploadWizImg} />
          </div>

          <div style={{display:"flex",justifyContent:"space-between",gap:8,marginTop:18}}>
            <button style={BS} onClick={finishNow}>Save & finish later</button>
            <button style={BP} onClick={nextWizDoor}>{wizStep+1<parsedDoors.length?"Next Door →":"Finish & Save"}</button>
          </div>
        </>}
      </div>
    </div>
  );
}

// Wizard field helpers
function WizField({label,value,onChange,type,select,opts,full}){
  return(
    <div style={{display:"flex",flexDirection:"column",gap:4,gridColumn:full?"1/-1":"auto"}}>
      <label style={LS}>{label}</label>
      {select?(
        <select style={IS} value={value} onChange={e=>onChange(e.target.value)}>
          <option value="">— select —</option>
          {(opts||[]).map(o=><option key={o}>{o}</option>)}
        </select>
      ):(
        <input style={IS} type={type||"text"} value={value} onChange={e=>onChange(e.target.value)} />
      )}
    </div>
  );
}
function WizFieldDefault({label,fieldKey,curDoor,setCurDoor,defaults,setDef,useDefault,toggleDef,full,woMode}){
  const isDefault=useDefault[fieldKey];
  const displayVal=woMode?(curDoor.workOrder||""):(curDoor[fieldKey]||"");
  return(
    <div style={{display:"flex",flexDirection:"column",gap:3,gridColumn:full?"1/-1":"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <label style={LS}>{label}</label>
        <label style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer",fontSize:10,color:isDefault?C.accent:C.hint}}>
          <input type="checkbox" checked={isDefault} onChange={e=>{
            if(e.target.checked&&!defaults[fieldKey]){
              const v=woMode?(curDoor.workOrder||""):(curDoor[fieldKey]||"");
              setDef(fieldKey,v);
            }
            toggleDef(fieldKey,e.target.checked);
          }} style={{width:11,height:11}} />
          default for all
        </label>
      </div>
      <input style={{...IS,background:isDefault?C.accentLight:IS.background,borderColor:isDefault?C.accent:undefined}} value={displayVal}
        onChange={e=>{
          const v=e.target.value;
          if(woMode) setCurDoor(d=>({...d,workOrder:v}));
          else setCurDoor(d=>({...d,[fieldKey]:v}));
          if(isDefault) setDef(fieldKey,v);
        }} />
    </div>
  );
}
function WizFieldDefaultSelect({label,fieldKey,opts,curDoor,setCurDoor,defaults,setDef,useDefault,toggleDef}){
  const isDefault=useDefault[fieldKey];
  return(
    <div style={{display:"flex",flexDirection:"column",gap:3}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <label style={LS}>{label}</label>
        <label style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer",fontSize:10,color:isDefault?C.accent:C.hint}}>
          <input type="checkbox" checked={isDefault} onChange={e=>{toggleDef(fieldKey,e.target.checked);}} style={{width:11,height:11}} />
          default for all
        </label>
      </div>
      <select style={{...IS,background:isDefault?C.accentLight:IS.background,borderColor:isDefault?C.accent:undefined}}
        value={curDoor[fieldKey]||""} onChange={e=>{
          setCurDoor(d=>({...d,[fieldKey]:e.target.value}));
          if(isDefault) setDef(fieldKey,e.target.value);
        }}>
        {opts.map(o=><option key={o}>{o}</option>)}
      </select>
    </div>
  );
}

function WizImg({label,field,value,onUpload}){
  const ref=useRef();
  const [drag,setDrag]=useState(false);
  const drop=e=>{e.preventDefault();setDrag(false);const f=e.dataTransfer.files[0];if(f)onUpload(field,f);};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      <label style={LS}>{label}</label>
      {value?(
        <div>
          <img src={value} alt={label} style={{width:"100%",maxHeight:90,objectFit:"contain",borderRadius:6,border:"1px solid rgba(0,0,0,0.1)"}} />
          <button style={{...BSm,marginTop:4,fontSize:10}} onClick={()=>onUpload(field,null)}>Remove</button>
        </div>
      ):(
        <div style={{border:`1px dashed ${drag?"#b87514":"rgba(0,0,0,0.18)"}`,background:drag?C.accentLight:"transparent",borderRadius:6,padding:"14px 10px",textAlign:"center",cursor:"pointer",fontSize:12,color:C.muted,transition:"all 0.15s"}}
          onClick={()=>ref.current.click()}
          onDragOver={e=>{e.preventDefault();setDrag(true);}}
          onDragLeave={()=>setDrag(false)}
          onDrop={drop}>
          {drag?"Drop to upload":"Click or drag & drop image"}
          <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&onUpload(field,e.target.files[0])} />
        </div>
      )}
    </div>
  );
}

// ── SETTINGS MODAL ────────────────────────────────────────────────────────────
function SettingsModal({apiKey,setApiKey,onClose,projects,doors,setProjects,setDoors}){
  const [key,setKey]=useState(apiKey);const importRef=useRef();
  const exportData=()=>{const blob=new Blob([JSON.stringify({projects,doors},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="door-registry-backup.json";a.click();};
  const importData=(e)=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.projects&&d.doors){setProjects(d.projects);setDoors(d.doors);lsSet("dr_projects",d.projects);lsSet("dr_doors",d.doors);alert("Imported successfully!");}else alert("Invalid backup file.");}catch{alert("Could not read file.");}};r.readAsText(file);};
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{...CS,width:480,maxWidth:"100%",boxShadow:"0 8px 32px rgba(0,0,0,0.15)"}}>
        <div style={{fontSize:16,fontWeight:500,marginBottom:20}}>Settings</div>
        <div style={{marginBottom:20}}>
          <label style={LS}>Anthropic API Key <span style={{textTransform:"none",letterSpacing:0,fontWeight:400,color:C.hint}}>(for PDF parsing)</span></label>
          <input style={IS} type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-..." />
          <div style={{fontSize:11,color:C.hint,marginTop:5}}>Stored only in this browser. Used only to call Anthropic directly for schedule parsing.</div>
        </div>
        <div style={{borderTop:"1px solid rgba(0,0,0,0.1)",paddingTop:16,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:500,marginBottom:10}}>Data Management</div>
          <div style={{display:"flex",gap:8,marginBottom:8}}><button style={BS} onClick={exportData}>Export Backup (.json)</button><button style={BS} onClick={()=>importRef.current.click()}>Import Backup</button><input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={importData} /></div>
          <div style={{fontSize:11,color:C.hint}}>Export regularly. Data lives in your browser — clearing cache will erase it without a backup.</div>
        </div>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button style={BS} onClick={onClose}>Cancel</button><button style={BP} onClick={()=>{setApiKey(key);onClose();}}>Save</button></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
